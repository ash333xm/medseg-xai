name: MedSeg-XAI M1 CI Pipeline

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate synthetic weights for offline verification
        run: |
          python scripts/download_weights.py --synthetic --output weights/medsam2_hiera_large.pt

      - name: Run Pytest Suite with Coverage
        run: |
          pytest tests/ -v --cov=medseg --cov=api --cov-report=term-missing
